[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mci-eeg-revised"
version = "0.2.0"
description = "Revised subject-level EEG classification and full-pipeline permutation workflow"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.1,<3", "scikit-learn>=1.4,<1.9", "torch>=2.2,<3", "mne>=1.7,<2", "shap>=0.46,<0.51", "matplotlib>=3.8,<4"]

[project.scripts]
mci-eeg = "mci_eeg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
